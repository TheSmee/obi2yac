services:
  obi2yac:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
      args:
        OBI2YAC_REF: "${OBI2YAC_REF}"

    image: local/obi2yac:latest
    container_name: obi2yac
    restart: unless-stopped
    init: true
      
    environment:
      TZ: "${TZ}"
      OBI2YAC_UDP_HOST: "${OBI2YAC_UDP_HOST}"
      OBI2YAC_UDP_PORT: "${OBI2YAC_UDP_PORT}"
      OBI2YAC_DATABASE_PATH: "${OBI2YAC_DATABASE_PATH}"
      OBI2YAC_LOG_LEVEL: "${OBI2YAC_LOG_LEVEL}"
      OBI2YAC_PUSHBULLET_ENABLED: "${OBI2YAC_PUSHBULLET_ENABLED}"
      OBI2YAC_PUSHBULLET_TOKEN: "${OBI2YAC_PUSHBULLET_TOKEN}"
      OBI2YAC_PUSHBULLET_TIMEOUT: "${OBI2YAC_PUSHBULLET_TIMEOUT}"
      OBI2YAC_SMTP_ENABLED: "${OBI2YAC_SMTP_ENABLED}"
      OBI2YAC_SMTP_HOST: "${OBI2YAC_SMTP_HOST}"
      OBI2YAC_SMTP_PORT: "${OBI2YAC_SMTP_PORT}"
      OBI2YAC_SMTP_TLS: "${OBI2YAC_SMTP_TLS}"
      OBI2YAC_SMTP_FROM_NAME: "${OBI2YAC_SMTP_FROM_NAME}"
      OBI2YAC_SMTP_FROM_ADDRESS: "${OBI2YAC_SMTP_FROM_ADDRESS}"
      OBI2YAC_SMTP_TO_ADDRESS: "${OBI2YAC_SMTP_TO_ADDRESS}"
      OBI2YAC_SMTP_SUBJECT: "${OBI2YAC_SMTP_SUBJECT}"
      OBI2YAC_DTMF_ENABLED: "${OBI2YAC_DTMF_ENABLED}"
      OBI2YAC_DTMF_TRIGGER_1: "${OBI2YAC_DTMF_TRIGGER_1}"
      OBI2YAC_DTMF_TRIGGER_2: "${OBI2YAC_DTMF_TRIGGER_2}"
      OBI2YAC_DTMF_TRIGGER_3: "${OBI2YAC_DTMF_TRIGGER_3}"
      OBI2YAC_DTMF_START_MARKER: "${OBI2YAC_DTMF_START_MARKER}"
      OBI2YAC_DTMF_END_MARKER: "${OBI2YAC_DTMF_END_MARKER}"
      OBI2YAC_DTMF_DIGIT_MARKER: "${OBI2YAC_DTMF_DIGIT_MARKER}"
      OBI2YAC_DTMF_ON_HOOK_MARKER: "${OBI2YAC_DTMF_ON_HOOK_MARKER}"
      OBI2YAC_HEALTH_TIMEOUT: "${OBI2YAC_HEALTH_TIMEOUT}"
      OBI2YAC_NCID_ENABLED: "${OBI2YAC_NCID_ENABLED}"
      OBI2YAC_NCID_HOST: "${OBI2YAC_NCID_HOST}"
      OBI2YAC_NCID_PORT: "${OBI2YAC_NCID_PORT}"

    volumes:
      - /volume1/docker/obi2yac/data:/data

    ports:
      - "${SYSLOG_HOST_PORT}:5514/udp"
