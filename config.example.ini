[network]
# Bind to 0.0.0.0 only on a trusted LAN or behind an appropriate firewall.
udp_host = 0.0.0.0
# AutoIt used port 514; choose an unprivileged port (for example 5514) when needed.
udp_port = 514
# Outgoing YAC client destination port.
yac_port = 10629
yac_timeout = 2

[health]
# HTTP health endpoint for Uptime Kuma and other monitors.
host = 0.0.0.0
port = 8080
# Mark unhealthy if no Syslog datagram arrives within this many seconds (15 minutes).
timeout = 900

[ncid]
enabled = false
host =
port = 3333

[database]
path = data/obi2yac.sqlite3

[logging]
level = INFO

[pushbullet]
enabled = false
# Set via OBI2YAC_PUSHBULLET_TOKEN rather than saving a real token in this file.
token =
timeout = 5

[smtp]
enabled = false
host = smtp.example.invalid
port = 25
# One of: none, starttls, ssl
tls = none
username =
password =
from_name = Obi2Yac Alert
from_address = obi2yac@example.invalid
to_address = operator@example.invalid
subject = Alarm Has Been Triggered

[dtmf]
enabled = false
# Define only the three sequences you want to alert on.
trigger_1 =
trigger_2 =
trigger_3 =
start_marker = [CPT] --- FXS h/w tone generator (dial)---
end_marker = [CPT] --- FXS h/w tone generator (ringback)---
digit_marker = [DSP]: ---- H/W DTMF ON (FXS: 0, level:1) :
on_hook_marker = [SLIC]:Slic#0 ONHOOK
